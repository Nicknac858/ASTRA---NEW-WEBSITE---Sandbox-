<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02040a"><title>Night Current — Higher Rank</title>
<style>/*__STYLE__*/</style>
</head>
<body>
<main id="journey" aria-label="Night Current, an interactive light sculpture">
<div id="stage">
  <picture class="poster" aria-hidden="true"><source media="(max-aspect-ratio: 4/5)" srcset="__PORTRAIT_STILL__"><img src="__WIDE_STILL__" alt=""></picture>
  <canvas id="scene" aria-label="Translucent cyan, fuchsia and citron wires meet above two suspended image windows." role="img"></canvas>
  <canvas id="light" aria-hidden="true"></canvas>
  <div id="windows">
    <button type="button" class="window-target" data-panel="ideas" aria-label="Open Ideas and experiments"><span>Ideas &amp; experiments</span></button>
    <button type="button" class="window-target" data-panel="inspiration" aria-label="Open Inspiration"><span>Inspiration</span></button>
  </div>
  <header class="top"><button class="wordmark" id="home" aria-label="Higher Rank, return to the opening knot">HIGHER RANK</button>
    <nav aria-label="Scene controls"><button id="index">Index <i class="plus" aria-hidden="true"></i></button>
    <button id="motion" aria-label="Pause motion" title="Pause motion"><i aria-hidden="true"></i><i aria-hidden="true"></i></button></nav>
  </header>
  <footer class="foot"><div><h1>Night Current</h1><button id="follow"><span class="wire-rule" aria-hidden="true"></span><span id="follow-word">Follow the wire</span></button></div></footer>
  <div class="travel" aria-hidden="true"><i></i></div>
</div>
<noscript><div class="nojs">Night Current is a light sculpture by Higher Rank. Enable JavaScript to explore the wires and suspended images.</div></noscript>
</main>
<dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-head"><span>HIGHER RANK</span><button id="close" aria-label="Close panel">Close <i class="cross" aria-hidden="true"></i></button></div>
<div id="sheet-body"></div></dialog>
<script>/*__ASSETS__*/</script>
<script>/*__SCRIPT__*/</script>
</body></html>
